name: Reusable Windows Build

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 离线定制版：下载安装包内置的运行时资源（Node / dsh / pnpm / MinGit），
      # 随安装包分发，用户安装/启动时不再联网下载，也不检查升级。
      - name: Download bundled offline runtime resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/offline
          cd src-tauri/resources/offline
          curl -fL --retry 3 -o deepseek-harness-pkg-windows.zip \
            "https://github.com/szdengdi/dsh-cmi/releases/download/dsh-src-0.1.2-rc.1-34064688986/deepseek-harness-pkg-windows.zip"
          curl -fL --retry 3 -o node-v22.22.0-win-x64.zip \
            "https://nodejs.org/dist/v22.22.0/node-v22.22.0-win-x64.zip"
          curl -fL --retry 3 -o MinGit-2.53.0.2-64-bit.zip \
            "https://github.com/git-for-windows/git/releases/download/v2.53.0.windows.2/MinGit-2.53.0.2-64-bit.zip"
          curl -fL --retry 3 -o pnpm-11.7.0.tgz \
            "https://registry.npmjs.org/pnpm/-/pnpm-11.7.0.tgz"
          echo "a26ef6406252f424eacf89ab4dea40e9f7bf8f102f4a13928b1ccc5aabc51eec  deepseek-harness-pkg-windows.zip" | sha256sum -c -
          echo "c97fa376d2becdc8863fcd3ca2dd9a83a9f3468ee7ccf7a6d076ec66a645c77a  node-v22.22.0-win-x64.zip" | sha256sum -c -
          echo "d4bf83d6a860ccae9af44e508e1e00a39f09db6fa78a9ba5543b94d87ca22a29  MinGit-2.53.0.2-64-bit.zip" | sha256sum -c -
          echo "deafa7ec98a1218b6a047289b92fbe2395c1e22d3495bb711653013218ee15ee  pnpm-11.7.0.tgz" | sha256sum -c -
          ls -lh

      # WiX 只接受纯数字版本；NSIS 仍使用完整 SemVer。
      - name: Prepare MSI version override
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const rawVer = require('./src-tauri/tauri.conf.json').version;
            const cleanVer = rawVer.replace(/[-+].*$/, '');
            fs.writeFileSync('release-msi-version.tmp.json', JSON.stringify({ bundle: { windows: { wix: { version: cleanVer } } } }));
            console.log('MSI version override ->', cleanVer);
          "

      - name: Build packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config release-msi-version.tmp.json

      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
