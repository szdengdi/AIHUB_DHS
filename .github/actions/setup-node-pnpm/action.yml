name: Setup Node.js and pnpm
description: Install the repository pnpm version and configure Node.js caching

inputs:
  node-version:
    description: Node.js version passed to actions/setup-node
    required: false
    default: '22'
  cache-dependency-path:
    description: Dependency lockfile used for the pnpm cache key
    required: false
    default: pnpm-lock.yaml
  cache-enabled:
    description: Whether to enable pnpm cache for setup-node (set to false for jobs that do not install dependencies)
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # package.json 的 packageManager 字段提供精确 pnpm 版本。
    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache-enabled == 'true' && 'pnpm' || '' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
